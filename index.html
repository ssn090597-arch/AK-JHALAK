<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AK JHALAK - Global Live Network Engine</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
<style>
  body { background-color: #0f0f0f; color: #f1f1f1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  .brand-logo-glow { filter: drop-shadow(0px 0px 8px rgba(239, 68, 68, 0.5)); }
</style>
</head>
<body class="overflow-x-hidden">

<!-- TOP NAVBAR -->
<nav class="fixed top-0 left-0 w-full bg-[#0f0f0f] z-40 flex items-center justify-between px-4 py-2 border-b border-zinc-800">
  <div class="flex items-center gap-3">
    <button class="p-2 hover:bg-zinc-800 rounded-full text-lg text-zinc-300"><i class="fa-solid fa-bars"></i></button>
    <a href="#" class="flex items-center gap-3 hover:opacity-95 transition-all">
      <img src="logo.png.png" id="mainAKLogo" class="h-10 sm:h-12 w-auto object-contain brand-logo-glow" alt="AK-JHALAK Logo" onerror="this.onerror=null; this.src='logo.png';">
    </a>
  </div>

  <!-- PUBLIC SEARCH -->
  <div class="flex items-center gap-3 w-1/2 max-w-2xl">
    <div class="flex items-center w-full bg-zinc-900 border border-zinc-700 rounded-full overflow-hidden focus-within:border-red-500">
      <input type="text" id="searchInput" placeholder="Search public videos or channels..." class="w-full bg-transparent px-4 py-2 text-sm text-white focus:outline-none">
      <button class="bg-zinc-800 px-6 py-2 border-l border-zinc-700 text-zinc-300"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="flex items-center gap-2 sm:gap-3">
    <button onclick="openLiveCameraModal()" class="flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-full text-xs font-medium text-red-400 border border-red-500/30">
      <i class="fa-solid fa-video text-red-500 animate-pulse"></i> Live Record
    </button>
    <button onclick="openUploadModal()" class="flex items-center gap-1.5 bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-full text-xs font-medium text-white border border-zinc-700">
      <i class="fa-solid fa-upload text-amber-400"></i> Upload Public
    </button>
    <button onclick="handleCreateChannelClick()" class="flex items-center gap-1.5 bg-gradient-to-r from-red-600 to-orange-500 hover:from-red-700 text-white font-bold px-4 py-1.5 rounded-full text-xs transition-all shadow-md">
      <i class="fa-solid fa-plus"></i> Create Channel
    </button>
  </div>
</nav>

<!-- MAIN CONTAINER -->
<div class="flex pt-16">
  <aside class="w-60 bg-[#0f0f0f] min-h-screen hidden md:block px-3 pt-3 fixed left-0 border-r border-zinc-800 text-sm space-y-1">
    <a href="#" class="flex items-center gap-5 px-3 py-2.5 bg-zinc-800 font-semibold rounded-xl text-red-500"><i class="fa-solid fa-house text-lg"></i> Public Feed</a>
    <a href="#" onclick="openLiveCameraModal()" class="flex items-center gap-5 px-3 py-2.5 hover:bg-zinc-800 rounded-xl text-zinc-300"><i class="fa-solid fa-camera text-lg text-red-500"></i> Live Recording</a>
    <a href="#" onclick="openUploadModal()" class="flex items-center gap-5 px-3 py-2.5 hover:bg-zinc-800 rounded-xl text-zinc-300"><i class="fa-solid fa-upload text-lg text-amber-400"></i> Upload Video</a>
    <hr class="border-zinc-800 my-2">
    <div id="verifiedAccountBadge" class="px-3 py-2 text-xs text-amber-400/80 bg-zinc-900 border border-zinc-800 rounded-xl">
      <i class="fa-solid fa-globe mr-1"></i> Public Sync: Active
    </div>
  </aside>

  <!-- MAIN PUBLIC FEED -->
  <main class="md:ml-60 w-full p-4">
    <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
      <!-- Public Videos Sync Here -->
    </div>
  </main>
</div>

<!-- PLAYER MODAL -->
<div id="playerModal" class="fixed inset-0 bg-black/95 z-50 hidden overflow-y-auto flex items-center justify-center p-2 sm:p-6">
  <div class="bg-zinc-900 w-full max-w-5xl rounded-2xl overflow-hidden border border-zinc-800 shadow-2xl my-auto">
    <div class="p-3 bg-zinc-800 flex justify-between items-center border-b border-zinc-700">
      <span class="font-bold text-xs text-red-500 flex items-center gap-2"><i class="fa-solid fa-play"></i> Public Stream Player</span>
      <button onclick="closePlayer()" class="text-zinc-400 hover:text-white text-2xl font-bold px-2">&times;</button>
    </div>
    <div class="aspect-video w-full bg-black flex items-center justify-center">
      <video id="html5Player" controls autoplay class="w-full h-full object-contain"></video>
    </div>
  </div>
</div>

<script>
// DEMO PUBLIC DATABASE (Local Fallback until Firebase Config is attached)
let publicFeed = JSON.parse(localStorage.getItem('AK_PUBLIC_FEED')) || [
  {
    id: '1',
    title: "AK JHALAK Official Welcome Stream - Public Engine Active",
    channel: "AK Official",
    logo: "logo.png.png",
    videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
    thumbnail: "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?auto=format&fit=crop&w=600&q=80"
  }
];

function renderPublicFeed() {
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = publicFeed.map(v => `
    <div onclick="playVideo('${v.videoUrl}')" class="cursor-pointer group space-y-2.5">
      <div class="relative aspect-video rounded-xl overflow-hidden bg-zinc-800 border border-zinc-800 group-hover:border-red-500/50 transition-all">
        <img src="${v.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition-all duration-300">
        <span class="absolute bottom-2 right-2 bg-black/80 text-red-500 text-[10px] font-bold px-2 py-0.5 rounded">WATCH</span>
      </div>
      <div class="flex gap-3 px-1">
        <img src="${v.logo}" class="w-9 h-9 rounded-full object-cover border border-zinc-700 shrink-0" onerror="this.src='logo.png'">
        <div class="space-y-0.5">
          <h3 class="text-xs font-bold text-white line-clamp-2 leading-snug group-hover:text-red-400">${v.title}</h3>
          <p class="text-[11px] text-zinc-400">${v.channel} <i class="fa-solid fa-circle-check text-red-500 text-[9px]"></i></p>
        </div>
      </div>
    </div>
  `).join('');
}

function playVideo(url) {
  const player = document.getElementById('html5Player');
  player.src = url;
  document.getElementById('playerModal').classList.remove('hidden');
}

function closePlayer() {
  const player = document.getElementById('html5Player');
  player.pause();
  document.getElementById('playerModal').classList.add('hidden');
}

renderPublicFeed();
</script>
</body>
</html>
